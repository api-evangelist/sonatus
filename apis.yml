aid: sonatus
name: Sonatus
description: 'Sonatus, Inc. is a Sunnyvale, California automotive software company, founded in 2018, that
  builds cloud-to-edge vehicle AI software for software-defined vehicles (SDVs). Its Fastlane platform
  pairs in-vehicle Fastlane Edge software with Fastlane Collector for dynamic, policy-driven vehicle data
  collection, Fastlane Insight for cloud-side analysis, and Fastlane Copilot for quick-start integration,
  alongside the Sonatus Automator vehicle-automation product. Sonatus states its technology is deployed
  in more than eight million vehicles worldwide, and it is backed by Hyundai Motor Group, Kia, LG, Marvell,
  NEC, Foxconn and Translink Capital. Sonatus sells to vehicle OEMs and tier-one suppliers rather than
  to individual developers: it markets an SDK comprising Sonatus Automator, APIs and documentation, but
  that developer surface is delivered to contracted OEM customers and is not published on any public developer
  portal.'
